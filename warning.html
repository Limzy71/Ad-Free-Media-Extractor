<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peringatan Keamanan - Tautan Berbahaya Dicegat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #09090b;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 32rem;
      width: 100%;
      background: rgba(69, 10, 10, 0.45);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 1.5rem;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      display: flex;
      flex-col;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .icon-wrapper {
      width: 4rem;
      height: 4rem;
      border-radius: 9999px;
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f87171;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fef2f2;
      line-height: 1.2;
    }
    p.desc {
      font-size: 0.875rem;
      color: #fca5a5;
      line-height: 1.5;
    }
    .url-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      color: #d4d4d8;
      word-break: break-all;
    }
    .btn-safe {
      width: 100%;
      padding: 0.875rem;
      background: #ffffff;
      color: #09090b;
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-safe:hover {
      background: #e4e4e7;
    }
    .btn-bypass {
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .btn-bypass:hover {
      color: #f4f4f5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>

    <h1>Tautan Berbahaya Dicegat</h1>
    <p class="desc">
      Sistem Smart Link Verifier mendeteksi bahwa tautan tujuan mengandung konten berisiko tinggi (Judi Online, Phishing, atau Malware).
    </p>

    <div class="url-box" id="targetUrl">https://...</div>

    <button class="btn-safe" id="btnSafe">Kembali ke Halaman Aman (Direkomendasikan)</button>
    <button class="btn-bypass" id="btnBypass">Lanjutkan ke situs berisiko (Tidak Disarankan)</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url') || 'Tidak diketahui';
    document.getElementById('targetUrl').textContent = targetUrl;

    document.getElementById('btnSafe').addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
      }
    });

    document.getElementById('btnBypass').addEventListener('click', () => {
      if (targetUrl && targetUrl !== 'Tidak diketahui') {
        window.location.href = targetUrl;
      }
    });
  </script>
</body>
</html>
